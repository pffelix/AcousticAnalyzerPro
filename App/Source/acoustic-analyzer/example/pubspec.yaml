name: acoustic_analyzer_pro
description: "Demonstrates how to use the flutter_recorder plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  flutter_recorder:
    path: ../

  flutter_soloud: ^4.0.0
    # path: ../../flutter_soloud
  audio_session: ^0.2.3

  cupertino_icons: ^1.0.8
  logging: ^1.3.0
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
